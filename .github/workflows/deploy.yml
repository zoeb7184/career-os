name: Deploy to Railway

# Runs only after the CI workflow (.github/workflows/ci.yml) finishes on
# main — not on every push. `workflow_run` fires once CI completes
# regardless of outcome, so the job itself is gated on conclusion ==
# 'success' below; a failing/red CI run never reaches `railway up`.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy api + frontend
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    container: ghcr.io/railwayapp/cli:latest
    env:
      # RAILWAY_TOKEN must be a *project* token (Railway dashboard → this
      # project → Settings → Tokens), not an account/personal token — a
      # project token already scopes project + environment on its own
      # (this one is career-os / production). Don't also pass --project /
      # --environment on the commands below: combining explicit UUID flags
      # with an already-scoped project token is what caused the earlier
      # "Service not found" failures — the token's implicit scoping and
      # the flags fight each other instead of agreeing. Bare `--service
      # <name>` is the reliable pattern (confirmed against Railway's own
      # community docs: https://station.railway.com/questions/deploy-using-ci-cd-github-actions-18407bf0).
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Service names must match Railway exactly (confirmed via `railway
      # status`) — this project's backend service is "career-os" (not
      # "api", which doesn't exist here).
      - name: Deploy backend API
        run: railway up --service career-os --ci

      - name: Deploy frontend
        run: railway up --service frontend --ci
