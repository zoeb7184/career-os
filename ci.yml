name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: career_os
          POSTGRES_USER: career_user
          POSTGRES_PASSWORD: career_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint
        run: cd backend && ruff check . --ignore E501

      - name: Run tests
        env:
          POSTGRES_URL: postgresql://career_user:career_pass@localhost:5432/career_os
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
          GROQ_API_KEY: test-key-not-real
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: development
          LOG_LEVEL: WARNING
          ADZUNA_APP_ID: test
          ADZUNA_APP_KEY: test
          REED_API_KEY: test
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          GROQ_MODEL_EXTRACTION: llama-3.1-8b-instant
          GROQ_MODEL_ADVISOR: llama-3.3-70b-versatile
        run: |
          cd backend
          pytest tests/ -v --tb=short
